<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sprungbereich.de - Zum Turm oder Klippen springen</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a192f">

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <!-- Splash / Startbildschirm mit Länderauswahl -->
  <div id="splashScreen" class="splash-screen">
    <div class="splash-content">
      <svg class="diver-animation" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path class="wave wave1" d="M0,155 Q50,140 100,155 T200,155 L200,200 L0,200 Z" />
        <path class="wave wave2" d="M0,165 Q50,150 100,165 T200,165 L200,200 L0,200 Z" />
        <path d="M40,140 L135,122" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" />
        <rect x="130" y="122" width="10" height="38" fill="#172a45" rx="3" />
        <g id="diverGroup">
          <circle cx="122" cy="97" r="7" fill="#ffffff" />
          <line x1="122" y1="104" x2="122" y2="122" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
          <line x1="122" y1="110" x2="110" y2="117" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
          <line x1="122" y1="110" x2="132" y2="102" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
          <line x1="122" y1="122" x2="114" y2="137" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
          <line x1="122" y1="122" x2="130" y2="137" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
        </g>
      </svg>

      <h1 class="splash-title">Sprungbereich<span>.de</span></h1>
      <p class="splash-subtitle">Zum Turm oder Klippen springen</p>

      <!-- Erster Filter: Länderauswahl beim Start -->
      <div class="splash-country-box">
        <label for="startCountrySelect">Land wählen:</label>
        <select id="startCountrySelect">
          <option value="de" selected>Deutschland</option>
          <option value="at">Österreich</option>
          <option value="ch">Schweiz</option>
          <option value="fr">Frankreich</option>
          <option value="it">Italien</option>
          <option value="es">Spanien</option>
        </select>
        <button id="startMapBtn" class="btn-primary-start">Karte öffnen 🚀</button>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <header class="top-overlay" id="topOverlay">
    <div class="logo-area">
      <h1 class="site-title">Sprungbereich<span>.de</span></h1>
      <p class="tagline">Zum Turm oder Klippen springen</p>
    </div>

    <div class="search-box">
      <div class="input-group">
        <select id="countryFilter" class="small-select" title="Land">
          <option value="de">DE</option>
          <option value="at">AT</option>
          <option value="ch">CH</option>
          <option value="fr">FR</option>
          <option value="it">IT</option>
          <option value="es">ES</option>
        </select>
        <input type="text" id="searchInput" placeholder="Ort oder PLZ eingeben...">
        <button id="searchBtn" class="btn-primary" title="Suchen">🔍</button>
        <button id="locateBtn" class="btn-secondary" title="Standort verwenden">📍</button>
      </div>

      <div class="filter-row">
        <select id="heightFilter">
          <option value="0">Alle Höhen</option>
          <option value="3">Ab 3m</option>
          <option value="5">Ab 5m</option>
          <option value="7.5">Ab 7.5m</option>
          <option value="10">Nur 10m Turm</option>
        </select>

        <select id="typeFilter">
          <option value="all">Alle Spots</option>
          <option value="Freibad">Freibad</option>
          <option value="Hallenbad">Hallenbad</option>
          <option value="See">See / Klippe</option>
        </select>
      </div>

      <div class="toggle-row">
        <label class="switch-label">
          <input type="checkbox" id="verifiedOnlyToggle">
          <span>Nur verifizierte Sprungspots</span>
        </label>
      </div>
    </div>
  </header>

  <a href="eintragen.html" class="fab-btn" title="Neuen Sprungspot eintragen">+</a>

  <div id="bottomSheet" class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-content">
      <div class="sheet-header">
        <h2 id="poolTitle">Spot Name</h2>
        <span id="verifiedBadge" class="badge-status">Unbestätigt</span>
      </div>
      <p id="poolType" class="badge">Freibad</p>
      <div id="poolDetails" class="pool-details"></div>
      
      <div class="action-buttons">
        <a id="navBtn" href="#" target="_blank" class="nav-btn">🧭 Route (Google Maps)</a>
        <a id="editBtn" href="eintragen.html" class="edit-btn">✏️ Daten ergänzen</a>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
