<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprungbereich.de</title>

  <!-- Google Font: Story Script -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Story+Script&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Loading Screen mit Text-Animation -->
  <div id="loadingScreen" class="loading-screen">
    <div class="splash-content">
      <h1 class="brand-title animated-title">Sprungbereich.de</h1>
      <p class="brand-claim animated-claim">
        Die intuitive Community Map für alle Turmspringer & Klippenspringer.
      </p>
      <div class="progress-bar-container">
        <div class="progress-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- Karte -->
  <div id="map"></div>

  <!-- UI Panel -->
  <div class="search-panel">
    
    <!-- Suche & Radius -->
    <div class="search-row">
      <div class="field-group flex-grow">
        <span class="field-label">Ort / PLZ</span>
        <input type="text" id="searchInput" value="10117" placeholder="z. B. 10117 oder Berlin">
      </div>
      
      <div class="field-group">
        <span class="field-label">Radius</span>
        <select id="radiusFilter" class="glass-select">
          <option value="10">10 km</option>
          <option value="25" selected>25 km</option>
          <option value="50">50 km</option>
          <option value="100">100 km</option>
        </select>
      </div>

      <button id="searchBtn" class="btn-search-glow" title="Suchen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
    </div>

    <!-- Filter Zeile -->
    <div class="filter-row">
      <div class="field-group flex-1">
        <span class="field-label">Mindest-Sprunghöhe</span>
        <select id="heightFilter" class="glass-select">
          <option value="0">Alle Höhen</option>
          <option value="1">Ab 1m Brett</option>
          <option value="3">Ab 3m Turm</option>
          <option value="5">Ab 5m Turm</option>
          <option value="7.5">Ab 7.5m Turm</option>
          <option value="10">🔥 Ab 10m Profi-Turm</option>
        </select>
      </div>

      <div class="field-group flex-1">
        <span class="field-label">Spot-Kategorie</span>
        <select id="typeFilter" class="glass-select">
          <option value="all">Alle Arten</option>
          <option value="Freibad">Freibad</option>
          <option value="Hallenbad">Hallenbad</option>
          <option value="See">See / Klippe</option>
        </select>
      </div>
    </div>

    <!-- Footer Toggle -->
    <div class="filter-footer">
      <label class="toggle-container">
        <input type="checkbox" id="verifiedOnlyToggle">
        <span class="toggle-custom"></span>
        <span class="toggle-text">Nur verifizierte Spots</span>
      </label>
    </div>
  </div>

  <!-- Bottom Sheet (Detail-Panel) mit Schließen-Button -->
  <div id="bottomSheet" class="bottom-sheet">
    <button id="closeSheetBtn" class="btn-close-sheet" title="Schließen">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <div class="sheet-content">
      <h2 id="poolTitle">Badname</h2>
      <p id="poolType">Typ & Höhe</p>
      <span id="verifiedBadge" class="badge">Status</span>
      <div class="sheet-actions">
        <a id="navBtn" href="#" target="_blank" class="btn-nav">Route starten</a>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map.js"></script>
</body>
</html>
