<body>

  <!-- Loading / Splash Screen mit animierter blauer SVG-Sprungszene -->
  <div id="splashScreen" class="splash-screen">
    <div class="splash-content">
      <svg class="diver-animation" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

        <path class="wave wave1" d="M0,155 Q50,140 100,155 T200,155 L200,200 L0,200 Z" />
        <path class="wave wave2" d="M0,165 Q50,150 100,165 T200,165 L200,200 L0,200 Z" />

        <!-- Sprungbrett: Ruheposition exakt horizontal/flach -->
        <g id="boardGroup">
          <path d="M40,123 L135,123" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" />
        </g>

        <!-- Mast/Halterung bleibt fix, federt nicht mit -->
        <rect x="130" y="123" width="10" height="37" fill="#172a45" rx="3" />

        <!-- Strichmännchen / Diver: steht vorne LINKS, Füße exakt auf der Brettlinie (y=123) -->
        <g id="diverGroup">
          <!-- Kopf -->
          <circle cx="40" cy="88" r="7" fill="#ffffff" />

          <line x1="40" y1="95" x2="40" y2="113" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
          <!-- Arme (ab Schulter) -->
          <line x1="40" y1="99" x2="29" y2="105" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
