<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sprungbereich.de — Premium Sprungspots entdecken</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#060913">

  <!-- GSAP & Supabase -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- 2026er Immersive Splash Screen -->
  <div id="splashScreen" class="splash-screen">
    <div class="splash-glow"></div>
    <div class="splash-content">
      <div class="brand-logo-badge">
        <span class="badge-icon">🌊</span>
      </div>
      <h1 class="splash-title">Sprungbereich<span>.de</span></h1>
      <p class="splash-subtitle">Die ultimative Map für Turm- und Klippenspringen</p>

      <div class="splash-country-card">
        <div class="select-wrapper">
          <label for="startCountrySelect">Einsatzgebiet wählen</label>
          <select id="startCountrySelect">
            <option value="de" selected>🇩🇪 Deutschland</option>
            <option value="at">🇦🇹 Österreich</option>
            <option value="ch">🇨🇭 Schweiz</option>
            <option value="fr">🇫🇷 Frankreich</option>
            <option value="it">🇮🇹 Italien</option>
            <option value="es">🇪🇸 Spanien</option>
          </select>
        </div>
        <button id="startMapBtn" class="btn-primary-start">
          <span>Karte erkunden</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Leaflet Map Container -->
  <div id="map"></div>

  <!-- Floating 2026 Glassmorphism Header & Search -->
  <header class="top-overlay" id="topOverlay">
    <div class="brand-header">
      <div class="mini-logo">🌊</div>
      <div>
        <h1 class="site-title">Sprungbereich<span>.de</span></h1>
        <p class="tagline">Live Filter & Spots</p>
      </div>
    </div>

    <div class="search-panel">
      <div class="search-row">
        <select id="countryFilter" class="glass-select country-pill" title="Land">
          <option value="de">🇩🇪 DE</option>
          <option value="at">🇦🇹 AT</option>
          <option value="ch">🇨🇭 CH</option>
          <option value="fr">🇫🇷 FR</option>
          <option value="it">🇮🇹 IT</option>
          <option value="es">🇪🇸 ES</option>
        </select>
        <div class="input-container">
          <input type="text" id="searchInput" placeholder="Stadt, PLZ oder Spot suchen...">
        </div>
        <button id="searchBtn" class="btn-search-glow" title="Suchen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
      </div>

      <div class="filter-row">
        <select id="heightFilter" class="glass-select">
          <option value="0">⚡ Alle Höhen</option>
          <option value="1">1m Brett / Plattform</option>
          <option value="3">Ab 3m Turm</option>
          <option value="5">Ab 5m Turm</option>
          <option value="7.5">Ab 7.5m Turm</option>
          <option value="10">🔥 10m Profi-Turm</option>
        </select>

        <select id="typeFilter" class="glass-select">
          <option value="all">🏊‍♂️ Alle Typen</option>
          <option value="Freibad">Freibad</option>
          <option value="Hallenbad">Hallenbad</option>
          <option value="See">See / Klippe</option>
        </select>
      </div>

      <div class="filter-footer">
        <label class="toggle-container">
          <input type="checkbox" id="verifiedOnlyToggle">
          <span class="toggle-custom"></span>
          <span class="toggle-text">Nur verifizierte Spots</span>
        </label>
      </div>
    </div>
  </header>

  <!-- Floating Action Button (Neuer Spot) -->
  <a href="eintragen.html" class="fab-btn" title="Neuen Spot eintragen">
    <span>+</span>
  </a>

  <!-- High-End Bottom Sheet (Details) -->
  <div id="bottomSheet" class="bottom-sheet">
    <div class="sheet-indicator"></div>
    <div class="sheet-body">
      <div class="sheet-top">
        <div>
          <span id="poolType" class="pill-badge">Freibad</span>
          <h2 id="poolTitle">Spot Name</h2>
        </div>
        <span id="verifiedBadge" class="badge-verified">Verifiziert</span>
      </div>
      
      <div class="sheet-divider"></div>

      <div class="action-dock">
        <a id="navBtn" href="#" target="_blank" class="btn-action-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
          Route starten
        </a>
        <a id="editBtn" href="eintragen.html" class="btn-action-secondary">
          Daten anpassen
        </a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
